{% extends 'base.html' %}

{% block content %}
{% csrf_token %}
<style>
    * {
        -webkit-tap-highlight-color: transparent;
    }

    .game-container {
        max-width: 720px;
        margin: 0 auto;
        padding: 0 10px 40px;
    }

    /* ═══ ИНДИКАТОР СТАДИИ ═══ */
    .stage-indicator {
        background: linear-gradient(135deg, rgba(232, 201, 100, 0.15) 0%, rgba(232, 201, 100, 0.05) 100%);
        border: 1px solid var(--border-2);
        border-radius: var(--radius);
        padding: 16px 20px;
        text-align: center;
        margin-bottom: 16px;
        box-shadow: var(--glow-gold);
    }

    .stage-indicator h3 {
        font-family: 'Playfair Display', serif;
        font-size: 1.3rem;
        margin: 0;
        color: var(--gold);
        text-shadow: 0 0 20px rgba(232, 201, 100, 0.3);
    }

    /* ═══ КАРТОЧКИ ИГРОКОВ ═══ */
    .player-card {
        background: var(--surface-2);
        border-radius: 60px;
        padding: 14px 18px;
        margin: 8px 0;
        cursor: pointer;
        transition: all 0.2s ease;
        border: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 1rem;
        color: var(--text);
        touch-action: manipulation;
    }

    .player-card:active {
        transform: scale(0.98);
        background: var(--surface-3);
    }

    .player-card.selected {
        border-color: var(--gold);
        background: linear-gradient(135deg, rgba(232, 201, 100, 0.15) 0%, rgba(232, 201, 100, 0.05) 100%);
        color: var(--gold);
    }

    /* ═══ ИГРОВОЙ ЛОГ ═══ */
    .game-log {
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 16px;
        max-height: 350px;
        overflow-y: auto;
        margin-top: 16px;
    }

    .game-log h6 {
        font-family: 'Playfair Display', serif;
        color: var(--text);
        font-size: 1.05rem;
        margin-bottom: 12px;
    }

    .log-entry {
        padding: 10px 14px;
        border-left: 3px solid var(--gold);
        margin: 8px 0;
        background: var(--surface-3);
        border-radius: 12px;
        font-size: 0.85rem;
        word-break: break-word;
        color: var(--text-soft);
    }

    /* ═══ НОЧНАЯ ФОРМА ═══ */
    .night-form {
        background: var(--surface);
        border: 1px solid var(--border-2);
        color: var(--text);
        padding: 22px;
        border-radius: var(--radius);
        margin: 15px 0;
        box-shadow: var(--shadow);
    }

    .night-form h5 {
        font-family: 'Playfair Display', serif;
        color: var(--gold);
        text-align: center;
        margin-bottom: 1rem;
        font-size: 1.2rem;
    }

    .night-form select,
    .night-form input {
        background: var(--surface-2);
        color: var(--text);
        border: 1px solid var(--border);
        padding: 14px 18px;
        border-radius: 60px;
        width: 100%;
        margin: 8px 0;
        font-size: 1rem;
        font-family: inherit;
        -webkit-appearance: none;
        appearance: none;
        transition: all 0.2s ease;
    }

    .night-form select:focus,
    .night-form input:focus {
        outline: none;
        border-color: var(--gold);
        box-shadow: 0 0 0 3px rgba(232, 201, 100, 0.15);
    }

    .night-form select option {
        background: var(--surface-2);
        color: var(--text);
    }

    .night-form label {
        font-size: 0.9rem;
        font-weight: 500;
        margin-left: 8px;
        color: var(--text-soft);
        display: block;
        margin-bottom: 4px;
    }

    .night-form small {
        color: var(--text-muted);
        font-size: 0.8rem;
        display: block;
        margin-left: 8px;
    }

    /* ═══ ПАНЕЛЬ СТАТИСТИКИ ═══ */
    .stats-panel {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 20px;
        margin: 15px 0;
        box-shadow: var(--shadow);
    }

    .stats-panel h5 {
        font-family: 'Playfair Display', serif;
        color: var(--text);
        text-align: center;
        font-size: 1.2rem;
        margin-bottom: 1rem;
    }

    .stats-panel p {
        color: var(--text-soft);
    }

    .stats-panel strong {
        color: var(--gold);
    }

    /* ═══ БЕЙДЖИ СТАТУСОВ ═══ */
    .status-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 14px;
        border-radius: 30px;
        font-size: 0.8rem;
        font-weight: 600;
        margin: 4px;
        white-space: nowrap;
    }

    .status-alive {
        background: rgba(74, 222, 128, 0.15);
        color: var(--emerald);
        border: 1px solid rgba(74, 222, 128, 0.3);
    }

    .status-dead {
        background: rgba(239, 68, 68, 0.15);
        color: #fca5a5;
        border: 1px solid rgba(239, 68, 68, 0.3);
    }

    /* ═══ КНОПКИ ═══ */
    .btn {
        border-radius: 60px !important;
        padding: 14px 20px !important;
        font-size: 1rem !important;
        font-weight: 600 !important;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
    }

    .btn:active {
        transform: scale(0.97);
    }

    /* ═══ МОДАЛЬНОЕ ОКНО ═══ */
    .modal.show {
        display: block !important;
        background: rgba(0, 0, 0, 0.85);
        z-index: 9999;
    }

    .modal-dialog {
        margin: 10px;
        width: calc(100% - 20px);
    }

    .modal-content {
        border-radius: var(--radius-lg);
        overflow: hidden;
        background: var(--surface);
        border: 1px solid var(--border-2);
    }

    .modal-header {
        background: linear-gradient(135deg, rgba(232, 201, 100, 0.2) 0%, rgba(232, 201, 100, 0.05) 100%) !important;
        border-bottom: 1px solid var(--border) !important;
        color: var(--text) !important;
        padding: 16px 20px;
    }

    .modal-title {
        font-family: 'Playfair Display', serif;
        color: var(--gold);
    }

    .modal-body {
        padding: 20px;
        max-height: 70vh;
        overflow-y: auto;
        background: var(--surface);
        color: var(--text);
    }

    .modal-footer {
        border-top: 1px solid var(--border) !important;
        padding: 16px 20px;
        gap: 10px;
    }

    /* ═══ РОЛИ В РЕВАНШЕ ═══ */
    .roles-grid-mobile {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
    }

    .roles-grid-mobile .role-item {
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 12px;
        text-align: center;
    }

    .roles-grid-mobile .role-item span {
        display: block;
        font-size: 0.8rem;
        margin-bottom: 8px;
        color: var(--text-soft);
    }

    .roles-grid-mobile input {
        text-align: center;
        padding: 10px;
        border-radius: 40px;
        border: 1px solid var(--border);
        background: var(--surface-3);
        color: var(--text);
        width: 100%;
        font-family: inherit;
    }

    /* ═══ ПОВТОР СЧЁТЧИКОВ (для модалки реванша) ═══ */
    .counter-group {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: var(--surface-2);
        padding: 12px 15px;
        border-radius: 60px;
        margin-bottom: 10px;
        border: 1px solid var(--border);
    }

    .counter-label {
        font-size: 1rem;
        font-weight: 500;
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--text);
    }

    .counter-controls {
        display: flex;
        align-items: center;
        gap: 12px;
        background: var(--surface-3);
        border-radius: 40px;
        padding: 5px;
        border: 1px solid var(--border);
    }

    .counter-btn {
        width: 44px;
        height: 44px;
        border-radius: 40px;
        border: none;
        font-size: 1.5rem;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .counter-btn.minus {
        background: rgba(239, 68, 68, 0.15);
        color: #fca5a5;
        border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .counter-btn.plus {
        background: rgba(74, 222, 128, 0.15);
        color: var(--emerald);
        border: 1px solid rgba(74, 222, 128, 0.3);
    }

    .counter-btn:active {
        transform: scale(0.92);
    }

    .counter-value {
        font-size: 1.3rem;
        font-weight: 700;
        min-width: 40px;
        text-align: center;
        color: var(--gold);
    }

    /* ═══ ПОКАЗ РОЛИ ═══ */
    .role-reveal {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: var(--surface);
        border: 2px solid var(--gold);
        padding: 32px 24px;
        border-radius: var(--radius-lg);
        text-align: center;
        z-index: 1000;
        min-width: 260px;
        width: 85%;
        max-width: 340px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7), var(--glow-gold);
        color: var(--text);
    }

    .role-reveal h3 {
        font-family: 'Playfair Display', serif;
        color: var(--gold);
        margin: 12px 0;
    }

    .role-reveal p {
        color: var(--text-soft);
    }

    .overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.85);
        backdrop-filter: blur(6px);
        z-index: 999;
    }

    /* ═══ ЖИВЫЕ ИГРОКИ ═══ */
    .players-scroll {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin: 12px 0;
    }

    /* ═══ АЛЕРТЫ ═══ */
    .alert {
        background: var(--surface-2) !important;
        border: 1px solid var(--border) !important;
        border-left: 3px solid var(--amber) !important;
        border-radius: var(--radius-sm);
        padding: 12px 16px;
        font-size: 0.85rem;
        color: var(--text-soft);
    }

    .alert-warning {
        background: rgba(251, 191, 36, 0.08) !important;
        border-left-color: var(--amber) !important;
        color: var(--amber);
    }

    .alert i {
        margin-right: 6px;
    }

    /* ═══ ФИНАЛЬНЫЙ ЭКРАН ═══ */
    .game-over-box {
        padding: 24px;
        border-radius: var(--radius);
        margin: 20px 0;
        border: 2px solid;
    }

    .game-over-box.win-mafia {
        background: rgba(239, 68, 68, 0.1);
        border-color: rgba(239, 68, 68, 0.4);
    }

    .game-over-box.win-town {
        background: rgba(74, 222, 128, 0.1);
        border-color: rgba(74, 222, 128, 0.4);
    }

    .game-over-box h4 {
        font-family: 'Playfair Display', serif;
        margin: 0;
    }

    .game-over-box.win-mafia h4 {
        color: #fca5a5;
    }

    .game-over-box.win-town h4 {
        color: var(--emerald);
    }

    .final-player-row {
        padding: 12px 16px;
        margin: 6px 0;
        border-radius: 60px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 0.95rem;
    }

    .final-player-row.alive {
        background: rgba(74, 222, 128, 0.12);
        border: 1px solid rgba(74, 222, 128, 0.25);
        color: var(--text);
    }

    .final-player-row.dead {
        background: rgba(239, 68, 68, 0.12);
        border: 1px solid rgba(239, 68, 68, 0.25);
        color: var(--text-muted);
    }

    /* ═══ КНОПКА ПОКАЗА РОЛИ ═══ */
    .role-show-btn {
        background: var(--surface-2);
        border: 1px solid var(--border-2);
        color: var(--gold);
        border-radius: 60px;
        padding: 14px 20px;
        font-size: 1rem;
        font-weight: 600;
        width: 100%;
        cursor: pointer;
        transition: all 0.2s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
    }

    .role-show-btn:hover {
        border-color: var(--gold);
        background: rgba(232, 201, 100, 0.08);
    }

    .role-show-btn:active {
        transform: scale(0.97);
    }

    /* ═══ АДАПТИВ ═══ */
    @media (max-width: 480px) {
        .stage-indicator h3 {
            font-size: 1.1rem;
        }

        .stats-panel {
            padding: 16px;
        }

        .night-form {
            padding: 16px;
        }

        .btn {
            padding: 12px 16px !important;
        }

        .status-badge {
            font-size: 0.72rem;
            padding: 5px 10px;
        }

        .log-entry {
            font-size: 0.78rem;
            padding: 8px 12px;
        }

        .counter-btn {
            width: 40px;
            height: 40px;
            font-size: 1.3rem;
        }

        .counter-value {
            font-size: 1.1rem;
            min-width: 35px;
        }
    }
</style>

<div class="game-container">
    <div class="stage-indicator">
        <h3 id="stageName">{{ game.get_stage_display }}</h3>
    </div>

    <div id="gameContent"></div>

    <div class="game-log">
        <h6>📋 Ход игры</h6>
        <div id="logEntries"></div>
    </div>
</div>

<script>
const gameCode = '{{ game.code }}';
let currentStage = '{{ game.stage }}';
let gameData = null;
let autoRefreshInterval = null;
let isInputMode = false;

function getCSRFToken() {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, 10) === ('csrftoken' + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(10));
                break;
            }
        }
    }
    return cookieValue || document.querySelector('[name=csrfmiddlewaretoken]')?.value;
}

function startAutoRefresh() {
    if (autoRefreshInterval) clearInterval(autoRefreshInterval);
    if (!isInputMode) {
        autoRefreshInterval = setInterval(() => {
            fetch(`/mafia/${gameCode}/api/`)
                .then(r => r.json())
                .then(data => {
                    if (data.stage !== currentStage) {
                        updateGame();
                    } else if (!isInputMode) {
                        gameData = data;
                        updateLog(data.game_log);
                    }
                })
                .catch(error => console.error('Ошибка автообновления:', error));
        }, 5000);
    }
}

function stopAutoRefresh() {
    if (autoRefreshInterval) {
        clearInterval(autoRefreshInterval);
        autoRefreshInterval = null;
    }
}

function updateGame() {
    return fetch(`/mafia/${gameCode}/api/`)
        .then(r => r.json())
        .then(data => {
            gameData = data;
            currentStage = data.stage;
            document.getElementById('stageName').textContent = data.stage_name;
            renderGameContent();
            updateLog(data.game_log);
            startAutoRefresh();
        })
        .catch(error => console.error('Ошибка:', error));
}

function renderGameContent() {
    const container = document.getElementById('gameContent');
    if (!container) return;

    if (currentStage === 'role_distribution') {
        renderRoleDistribution(container);
    } else if (currentStage === 'night_processing') {
        renderNightProcessing(container);
    } else if (currentStage === 'night_results') {
        renderNightResults(container);
    } else if (currentStage === 'day_discussion') {
        renderDayDiscussion(container);
    } else if (currentStage === 'day_voting') {
        renderDayVoting(container);
    } else if (currentStage === 'day_results') {
        renderDayResults(container);
    } else if (currentStage === 'game_over') {
        renderGameOver(container);
    }
}

function renderRoleDistribution(container) {
    let html = '<div class="stats-panel">';
    html += '<h5>🎭 Раздача ролей</h5>';
    html += '<p style="text-align: center; margin-bottom: 1rem;">Передавайте телефон игрокам по очереди</p>';
    html += '<div class="d-grid gap-2">';

    gameData?.players?.forEach((player, index) => {
        html += `<button class="role-show-btn" onclick="showRole(${index})">👤 Показать роль для ${player.name}</button>`;
    });

    html += '</div>';
    html += `<button class="btn btn--success w-100 mt-4" onclick="nextStage()">
                <i class="fas fa-check"></i>Все посмотрели роли
             </button>`;
    html += '</div>';
    container.innerHTML = html;
}

function renderNightProcessing(container) {
    isInputMode = true;
    stopAutoRefresh();

    const alivePlayers = gameData?.alive_players || [];
    const playerOptions = `<option value="">— Никого —</option>` +
        alivePlayers.map(p => `<option value="${p.name}">${p.icon} ${p.name} (${p.role_name})</option>`).join('');

    const sheriffAlive = gameData?.players?.some(p => p.role === 'sheriff' && p.alive);
    const donAlive = gameData?.players?.some(p => p.role === 'don' && p.alive);

    let html = '<div class="night-form">';
    html += '<h5>🌙 Ночная фаза</h5>';
    html += '<p style="text-align: center; margin-bottom: 1rem; font-size: 0.85rem; color: var(--text-muted);">Ведущий, опросите игроков и введите их действия</p>';

    // 1. Мафия
    if ((gameData?.mafia_count || 0) > 0) {
        html += `<div class="mb-3">
            <label>🔪 Кого убивает мафия?</label>
            <select id="mafiaTarget" class="form-control">
                ${playerOptions}
            </select>
            <small>Выберите игрока или оставьте "— Никого —"</small>
        </div>`;
    }

    // 2. Дон
    if (donAlive && sheriffAlive) {
        html += `<div class="mb-3">
            <label>👑 Кого проверяет дон мафии?</label>
            <select id="donCheck" class="form-control">
                ${playerOptions}
            </select>
            <small>Дон проверяет, является ли игрок шерифом</small>
        </div>`;
    } else if (donAlive && !sheriffAlive) {
        html += `<div class="mb-3">
            <div class="alert alert-warning">
                <i class="fas fa-info-circle"></i>
                Шериф мертв, поэтому дон мафии не может никого проверять этой ночью.
            </div>
        </div>`;
    }

    // 3. Шериф
    if (sheriffAlive) {
        html += `<div class="mb-3">
            <label>🔍 Кого проверяет шериф?</label>
            <select id="sheriffCheck" class="form-control">
                ${playerOptions}
            </select>
            <small>Шериф проверяет, является ли игрок мафией</small>
        </div>`;
    }

    // 4. Доктор
    const hasDoctor = gameData?.players?.some(p => p.role === 'doctor' && p.alive);
    if (hasDoctor) {
        html += `<div class="mb-3">
            <label>💊 Кого лечит доктор?</label>
            <select id="doctorHeal" class="form-control">
                ${playerOptions}
            </select>
            <small>Доктор может вылечить игрока от убийства</small>
        </div>`;
    }

    // 5. Маньяк
    const hasManiac = gameData?.players?.some(p => p.role === 'maniac' && p.alive);
    if (hasManiac) {
        html += `<div class="mb-3">
            <label>🥷🏻 Кого убивает маньяк?</label>
            <select id="maniacTarget" class="form-control">
                ${playerOptions}
            </select>
            <small>Маньяк убивает независимо от мафии</small>
        </div>`;
    }

    // 6. Телохранитель
    const hasBodyguard = gameData?.players?.some(p => p.role === 'bodyguard' && p.alive);
    if (hasBodyguard) {
        html += `<div class="mb-3">
            <label>🛡️ Кого защищает телохранитель?</label>
            <select id="bodyguardProtect" class="form-control">
                ${playerOptions}
            </select>
            <small>Защищает и от мафии, и от маньяка. При нападении погибает сам</small>
        </div>`;
    }

    // 7. Путана
    const hasHooker = gameData?.players?.some(p => p.role === 'hooker' && p.alive);
    if (hasHooker) {
        html += `<div class="mb-3">
            <label>💄 Кого отключает путана?</label>
            <select id="hookerBlock" class="form-control">
                ${playerOptions}
            </select>
            <small>Заблокированный игрок не может использовать свою способность</small>
        </div>`;
    }

    html += `<button class="btn btn--primary w-100 mt-3" onclick="submitNightActions()">
                <i class="fas fa-check"></i>Завершить ночь
             </button>`;
    html += `<button class="btn btn--ghost w-100 mt-2" onclick="cancelNightActions()">
                <i class="fas fa-undo"></i>Отмена
             </button>`;
    html += '</div>';

    container.innerHTML = html;
}

async function submitNightActions() {
    const actions = [];

    const mafiaTarget = document.getElementById('mafiaTarget')?.value;
    if (mafiaTarget && mafiaTarget !== '') {
        actions.push({ action: 'mafia_target', target: mafiaTarget });
    }

    const donCheck = document.getElementById('donCheck')?.value;
    if (donCheck && donCheck !== '') {
        actions.push({ action: 'don_check', target: donCheck });
    }

    const sheriffCheck = document.getElementById('sheriffCheck')?.value;
    if (sheriffCheck && sheriffCheck !== '') {
        actions.push({ action: 'sheriff_check', target: sheriffCheck });
    }

    const doctorHeal = document.getElementById('doctorHeal')?.value;
    if (doctorHeal && doctorHeal !== '') {
        actions.push({ action: 'doctor_heal', target: doctorHeal });
    }

    const maniacTarget = document.getElementById('maniacTarget')?.value;
    if (maniacTarget && maniacTarget !== '') {
        actions.push({ action: 'maniac_target', target: maniacTarget });
    }

    const bodyguardProtect = document.getElementById('bodyguardProtect')?.value;
    if (bodyguardProtect && bodyguardProtect !== '') {
        actions.push({ action: 'bodyguard_protect', target: bodyguardProtect });
    }

    const hookerBlock = document.getElementById('hookerBlock')?.value;
    if (hookerBlock && hookerBlock !== '') {
        actions.push({ action: 'hooker_block', target: hookerBlock });
    }

    const csrfToken = getCSRFToken();

    for (const actionData of actions) {
        try {
            const response = await fetch(`/mafia/${gameCode}/action/`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrfToken },
                body: JSON.stringify(actionData)
            });
            const result = await response.json();
            console.log(`Отправлено ${actionData.action}:`, result);
        } catch (error) {
            console.error(`Ошибка при отправке ${actionData.action}:`, error);
        }
    }

    setTimeout(() => {
        isInputMode = false;
        nextStage();
    }, 500);
}

function submitDayVote() {
    const voteResult = document.getElementById('voteResult')?.value;
    const jesterVictim = document.getElementById('jesterVictim')?.value;

    if (!voteResult) {
        alert('Выберите результат голосования');
        return;
    }

    const csrfToken = getCSRFToken();

    fetch(`/mafia/${gameCode}/action/`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrfToken },
        body: JSON.stringify({ action: 'day_vote_result', target: voteResult })
    })
    .then(r => r.json())
    .then(data => {
        if (!data.success) throw new Error('Ошибка');
        if (jesterVictim && jesterVictim !== 'никого' && voteResult !== 'никого') {
            return fetch(`/mafia/${gameCode}/action/`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrfToken },
                body: JSON.stringify({ action: 'jester_victim', target: jesterVictim })
            });
        }
        return null;
    })
    .then(() => {
        isInputMode = false;
        nextStage();
    })
    .catch(error => {
        console.error('Ошибка:', error);
        alert('Ошибка при сохранении');
        isInputMode = false;
        startAutoRefresh();
        updateGame();
    });
}

function closeRematchModal() {
    const modal = document.getElementById('rematchModal');
    if (modal) {
        modal.remove();
        document.body.style.overflow = '';
    }
}

function changeRematchRole(role, delta) {
    let newValue = window.rematchRolesData[role] + delta;
    let maxValue = 5;

    const uniqueRoles = ['don', 'sheriff', 'doctor', 'jester', 'maniac', 'bodyguard', 'hooker'];
    if (uniqueRoles.includes(role)) {
        maxValue = 2;
    }

    if (newValue >= 0 && newValue <= maxValue) {
        window.rematchRolesData[role] = newValue;
        updateRematchDisplay();
        checkRematchRoleBalance();
    }
}

function updateRematchDisplay() {
    document.getElementById('rematchMafiaCount').innerText = window.rematchRolesData.mafia;
    document.getElementById('rematchDonCount').innerText = window.rematchRolesData.don;
    document.getElementById('rematchSheriffCount').innerText = window.rematchRolesData.sheriff;
    document.getElementById('rematchDoctorCount').innerText = window.rematchRolesData.doctor;
    document.getElementById('rematchJesterCount').innerText = window.rematchRolesData.jester;
    document.getElementById('rematchManiacCount').innerText = window.rematchRolesData.maniac;
    document.getElementById('rematchBodyguardCount').innerText = window.rematchRolesData.bodyguard;
    document.getElementById('rematchHookerCount').innerText = window.rematchRolesData.hooker;
}

function checkRematchRoleBalance() {
    const totalRoles = window.rematchRolesData.mafia + window.rematchRolesData.don +
                       window.rematchRolesData.sheriff + window.rematchRolesData.doctor +
                       window.rematchRolesData.jester + window.rematchRolesData.maniac +
                       window.rematchRolesData.bodyguard + window.rematchRolesData.hooker;

    const playerCount = window.currentPlayerCountForRematch || 6;
    const warning = document.getElementById('rematchRoleWarning');

    if (totalRoles > playerCount) {
        warning.style.display = 'block';
        warning.innerHTML = `⚠️ Слишком много ролей (${totalRoles}) для ${playerCount} игроков! Уменьшите количество.`;
        return false;
    } else if (totalRoles === playerCount) {
        warning.style.display = 'block';
        warning.innerHTML = `ℹ️ Все ${playerCount} игроков будут иметь особые роли. Мирных жителей не будет.`;
        warning.style.background = 'rgba(96, 165, 250, 0.12)';
        warning.style.borderColor = 'rgba(96, 165, 250, 0.3)';
        warning.style.color = '#93c5fd';
        return true;
    } else {
        warning.style.display = 'none';
        return true;
    }
}

function startRematchWithRoles(playerNamesStr) {
    const playerNames = playerNamesStr.split(',');
    const playerCount = playerNames.length;
    window.currentPlayerCountForRematch = playerCount;

    const totalRoles = window.rematchRolesData.mafia + window.rematchRolesData.don +
                       window.rematchRolesData.sheriff + window.rematchRolesData.doctor +
                       window.rematchRolesData.jester + window.rematchRolesData.maniac +
                       window.rematchRolesData.bodyguard + window.rematchRolesData.hooker;

    if (totalRoles > playerCount) {
        alert(`Слишком много ролей (${totalRoles}) для ${playerCount} игроков!`);
        return;
    }

    let roles = [];
    for (let i = 0; i < window.rematchRolesData.mafia; i++) roles.push('mafia');
    for (let i = 0; i < window.rematchRolesData.don; i++) roles.push('don');
    for (let i = 0; i < window.rematchRolesData.sheriff; i++) roles.push('sheriff');
    for (let i = 0; i < window.rematchRolesData.doctor; i++) roles.push('doctor');
    for (let i = 0; i < window.rematchRolesData.jester; i++) roles.push('jester');
    for (let i = 0; i < window.rematchRolesData.maniac; i++) roles.push('maniac');
    for (let i = 0; i < window.rematchRolesData.bodyguard; i++) roles.push('bodyguard');
    for (let i = 0; i < window.rematchRolesData.hooker; i++) roles.push('hooker');

    const civilianCount = playerCount - roles.length;
    for (let i = 0; i < civilianCount; i++) roles.push('civilian');

    for (let i = roles.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [roles[i], roles[j]] = [roles[j], roles[i]];
    }

    const players = playerNames.map((name, index) => ({
        name: name.trim(),
        role: roles[index]
    }));

    fetch(`/mafia/${gameCode}/delete/`, {
        method: 'POST',
        headers: { 'X-CSRFToken': getCSRFToken() }
    }).catch(console.error);

    fetch('/mafia/create/', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': getCSRFToken()
        },
        body: JSON.stringify({ players: players })
    })
    .then(r => r.json())
    .then(data => {
        if (data.success) {
            closeRematchModal();
            window.location.href = data.redirect_url;
        } else {
            alert('Ошибка: ' + (data.error || 'Неизвестная ошибка'));
        }
    })
    .catch(error => {
        console.error('Ошибка:', error);
        alert('Ошибка при создании игры');
    });
}

document.addEventListener('DOMContentLoaded', () => {
    updateGame().then(() => startAutoRefresh());
});
</script>
{% endblock %}
