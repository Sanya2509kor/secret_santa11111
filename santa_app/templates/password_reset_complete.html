{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card card-elevated">
            <div class="card-header bg-success text-white">
                <h4 class="card-title mb-0 text-center">
                    <i class="fas fa-check-circle me-2"></i>Пароль изменен
                </h4>
            </div>
            <div class="card-body p-4 text-center">
                <div class="mb-4">
                    <i class="fas fa-check-circle fa-4x text-success mb-3"></i>
                    <h4>Пароль успешно изменен!</h4>
                    <p class="text-muted">
                        Теперь вы можете войти в систему с новым паролем.
                    </p>
                </div>
                
                <a href="{% url 'login' %}" class="btn btn-success w-100 btn-shine py-2 fw-semibold">
                    <i class="fas fa-sign-in-alt me-2"></i>Войти в систему
                </a>
                
                <div class="mt-4 pt-3 border-top">
                    <small class="text-muted">
                        Вернуться на 
                        <a href="{% url 'home' %}" class="text-decoration-none">главную страницу</a>
                    </small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
