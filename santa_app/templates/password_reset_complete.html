{% extends 'base.html' %}
{% block title %}Пароль изменён | Тайный Санта{% endblock %}
{% block page_modifier %}page--narrow{% endblock %}

{% block content %}
<div class="card fade-in-up" style="text-align: center;">
    <div class="card__body" style="padding: 3rem 2rem;">
        <div style="width: 80px; height: 80px; margin: 0 auto 1.5rem; background: var(--gradient-forest); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #052e16; font-size: 2.5rem; box-shadow: 0 0 40px rgba(74, 222, 128, 0.4);">
            <i class="fas fa-check"></i>
        </div>

        <h1 style="margin-bottom: 0.75rem;">Пароль изменён!</h1>
        <p style="color: var(--text-muted); margin-bottom: 2rem;">
            Теперь вы можете войти в систему с новым паролем.
        </p>

        <a href="{% url 'login' %}" class="btn btn--success btn--lg btn--shine">
            <i class="fas fa-sign-in-alt"></i>Войти в систему
        </a>

        <div class="divider"></div>

        <div style="color: var(--text-muted); font-size: 0.9rem;">
            Вернуться на <a href="{% url 'home' %}">главную</a>
        </div>
    </div>
</div>
{% endblock %}
